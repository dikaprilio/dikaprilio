# Redraws the "Version history" card from fresh GitHub activity every night and
# publishes it on the `output` branch, which README.md reads the image from.
name: Version history

on:
  schedule:
    - cron: "17 17 * * *" # 00:17 in Bogor (WIB)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/activity.yml"]

permissions:
  contents: read

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the output branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The built-in token only sees public activity; private work stays an anonymous count
      - name: Read the year's activity
        run: node scripts/refresh-activity.mjs "$GITHUB_REPOSITORY_OWNER"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Draw the cards
        run: node scripts/render.mjs

      - name: Check the committed cards match the generator
        run: git diff --exit-code -- README.md assets

      # One fresh commit each night, so the branch never grows
      - name: Publish on the output branch
        working-directory: live
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: redraw the version history card"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
